[package]
name = "rust-runner"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "rust-runner"
path = "src/main.rs"

[dependencies]
xstate-core = { path = "../../../crates/xstate-core" }
xstate-ir = { path = "../../../crates/xstate-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
