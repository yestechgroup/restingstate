[package]
name = "restingstate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "XState-compatible statechart compiler and runtime for Rust: parse TypeScript machines, interpret them, and run them as actors."
keywords = ["xstate", "statechart", "state-machine", "actor", "interpreter"]
categories = ["rust-patterns", "concurrency", "development-tools"]
readme = "README.md"

[dependencies]
xstate-core = { path = "crates/xstate-core", version = "0.2.0" }
xstate-ir = { path = "crates/xstate-ir", version = "0.2.0" }
xstate-parser = { path = "crates/xstate-parser", version = "0.2.0" }
xstate-backend-native = { path = "crates/xstate-backend-native", version = "0.2.0" }
xstate-actor = { path = "crates/xstate-actor", version = "0.2.0" }
xstate-codegen = { path = "crates/xstate-codegen", version = "0.2.0" }
xstate-macro = { path = "crates/xstate-macro", version = "0.2.0" }

[dev-dependencies]
serde_json.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/xstate-core",
    "crates/xstate-ir",
    "crates/xstate-parser",
    "crates/xstate-codegen",
    "crates/xstate-macro",
    "crates/xstate-macro-test",
    "crates/xstate-napi",
    "crates/xstate-wasm",
    "crates/xstate-actor",
    "crates/xstate-backend-native",
    "crates/xstate-bench",
    "tests/compatibility/rust-runner",
    "examples/rust-token-bucket",
    "examples/rust-dynamic",
    "examples/embed",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yestechgroup/restingstate"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"
oxc_parser = "0.77"
oxc_allocator = "0.77"
oxc_span = "0.77"
oxc_ast = "0.77"
thiserror = "2"
petgraph = "0.7"
schemars = "1"
proc-macro-error2 = "2"
miette = "7"
serde-wasm-bindgen = "0.6"
wasm-bindgen-test = "0.3.77"
