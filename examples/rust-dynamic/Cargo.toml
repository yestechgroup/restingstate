[package]
name = "rust-dynamic"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rust-dynamic"
path = "src/main.rs"

[dependencies]
xstate-core = { path = "../../crates/xstate-core" }
xstate-ir = { path = "../../crates/xstate-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
