[package]
name = "xstate-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc macro that compiles XState TypeScript machines into native Rust state machines."
readme = "README.md"
keywords = ["xstate", "statechart", "macro", "state-machine", "proc-macro"]
categories = ["rust-patterns"]

[lib]
proc-macro = true

[dependencies]
xstate-ir = { path = "../xstate-ir", version = "0.2.0" }
xstate-parser = { path = "../xstate-parser", version = "0.2.0" }
xstate-codegen = { path = "../xstate-codegen", version = "0.2.0" }
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
proc-macro-error2.workspace = true
