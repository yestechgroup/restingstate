[package]
name = "xstate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust runtime for XState statechart machines: interpreter, snapshots, and backend traits."
readme = "README.md"
keywords = ["xstate", "statechart", "state-machine", "interpreter", "snapshot"]
categories = ["rust-patterns", "concurrency"]

[features]
default = ["async"]
async = ["dep:tokio"]

[dependencies]
xstate-ir = { path = "../xstate-ir", version = "0.2.1" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["sync", "rt", "macros"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
