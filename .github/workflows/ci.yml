name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  compatibility:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: |
          npm ci
          npm install xstate@5
        working-directory: packages

      - name: Build Rust runner
        run: cargo build -p rust-runner --release

      - name: Run compatibility harness
        run: |
          set -e
          PASS=0
          FAIL=0
          for tv in tests/compatibility/machines/simple/*.json tests/compatibility/machines/compound/*.json tests/compatibility/machines/guards/*.json; do
            echo "::group::$(basename $tv)"
            node tests/compatibility/ts-runner.mjs "$tv" > /tmp/js-out.json
            ./target/release/rust-runner "$tv" > /tmp/rs-out.json
            if node tests/compatibility/compare.mjs /tmp/js-out.json /tmp/rs-out.json; then
              PASS=$((PASS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
            echo "::endgroup::"
          done
          echo "Compatibility: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ]

